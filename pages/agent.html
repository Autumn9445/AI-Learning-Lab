    <h2>一、主題介紹</h2>
    <p>AI Agent 是能根據任務目標進行判斷、執行步驟或使用工具的 AI 系統。</p>

    <h2>二、核心概念</h2>
    <p>常見方法包含 Reflection（反思）、Tool Use（工具使用）及 Planning（任務規劃）。</p>

    <h2>三、簡單範例</h2>
    <p>例如福爾摩斯推理 Agent，先由福爾摩斯提出推論，再讓華生檢查問題，最後重新修正答案。</p>

    <h2>四、重點整理</h2>
    <p>AI Agent 可以透過多個步驟完成任務，但執行結果仍需要檢查與驗證。</p>
