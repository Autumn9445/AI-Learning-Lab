    <a href="../index.html">← 返回首頁</a>

    <h2>一、主題介紹</h2>
    <p>Prompt 是提供給 AI 的指令或問題，會影響 AI 產生的回答。</p>

    <h2>二、核心概念</h2>
    <p>清楚描述任務、背景、限制與希望的回答格式，可以讓 AI 更了解需求。</p>

    <h2>三、簡單範例</h2>
    <p>例如不要只輸入「介紹 AI」，可以改成「請用繁體中文，以三個簡單例子介紹 AI 的應用」。</p>

    <h2>四、重點整理</h2>
    <p>好的 Prompt 應該具體、清楚，並依照 AI 的回應持續調整。</p>
