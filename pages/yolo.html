    <h2>一、主題介紹</h2>
    <p>YOLO 是一系列物件偵測模型，可以辨識圖片中的物件，並找出它們的位置。</p>

    <h2>二、核心概念</h2>
    <p>YOLO 會預測物件的類別、位置及信心分數，並使用邊界框標示偵測結果。</p>

    <h2>三、簡單範例</h2>
    <p>例如在道路照片中，YOLO 可以辨識汽車、行人等物件，並標示它們的位置。</p>

    <h2>四、重點整理</h2>
    <p>YOLO 常應用於影像辨識、交通監控及自動化檢測，但偵測結果仍可能發生誤判或漏判。</p>
