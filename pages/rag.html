    <h2>一、主題介紹</h2>
    <p>RAG 是檢索增強生成技術，讓 AI 先搜尋相關資料，再根據資料產生回答。</p>

    <h2>二、核心概念</h2>
    <p>RAG 通常包含文件處理、Embedding 向量化、資料檢索及 LLM 回答生成。</p>

    <h2>三、簡單範例</h2>
    <p>例如建立魔法商品知識庫，使用者詢問如何準時起床時，系統可以搜尋相關商品，再由 AI 推薦。</p>

    <h2>四、重點整理</h2>
    <p>RAG 可以讓 AI 使用外部資料回答問題，但仍需要檢查搜尋結果與回答是否正確。</p>
